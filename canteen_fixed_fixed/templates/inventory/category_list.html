{% extends 'base.html' %}
{% block content %}
<div class="page-header" style="max-width:580px;">
    <div>
        <p class="page-title">Categories</p>
        <p class="page-subtitle">Manage item categories</p>
    </div>
    <a href="{% url 'inventory_dashboard' %}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left"></i> Dashboard</a>
</div>

<div class="card form-card" style="margin-bottom:16px;">
    <div class="form-body" style="padding:20px;">
        <form method="post" style="display:flex; gap:10px; align-items:flex-end;">
            {% csrf_token %}
            <div class="form-group" style="flex:1;">
                <label>Name</label>
                <input type="text" name="name" required placeholder="e.g. Drinks, Snacks, Meals">
            </div>
            <div class="form-group" style="flex:1.5;">
                <label>Description <span style="font-weight:300; text-transform:none; letter-spacing:0;">(optional)</span></label>
                <input type="text" name="description" placeholder="Short description">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-bottom:1px;">Add</button>
        </form>
    </div>
</div>

<div class="card form-card" style="overflow:hidden;">
    <table>
        <thead>
            <tr><th>Category</th><th>Description</th><th></th></tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td style="font-weight:500;">{{ cat.name }}</td>
                <td style="color:var(--muted);">{{ cat.description|default:"—" }}</td>
                <td style="text-align:right;">
                    <form method="post" action="{% url 'category_delete' cat.pk %}" onsubmit="return confirm('Delete \'{{ cat.name }}\'?')">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger-ghost btn-icon btn-sm"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3"><div class="empty-state"><i class="bi bi-tags"></i>No categories yet</div></td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
