{% extends 'base.html' %}
{% block content %}
<div style="margin: 60px auto;">
    <div class="card delete-card" style="margin:0 auto;">
        <div class="delete-icon"><i class="bi bi-trash3"></i></div>
        <h3 style="font-size:18px; font-weight:500; margin-bottom:8px;">Delete item?</h3>
        <p style="color:var(--muted); font-size:13.5px; margin-bottom:24px;">
            <strong style="color:var(--text);">{{ item.name }}</strong> will be permanently removed. This cannot be undone.
        </p>
        <div style="display:flex; gap:8px; justify-content:center;">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger-ghost">Delete</button>
            </form>
            <a href="{% url 'inventory_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
