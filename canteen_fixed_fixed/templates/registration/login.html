{% extends 'base.html' %}
{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center;">
<div style="width:100%; max-width:400px;">

    <!-- Logo / Brand -->
    <div style="text-align:center; margin-bottom:32px;">
        <a href="/" style="text-decoration:none;">
            <div style="font-family:'DM Mono',monospace; font-size:22px; font-weight:500; color:var(--text); letter-spacing:-0.5px;">
                Canteen<span style="color:var(--accent);">IMS</span>
            </div>
        </a>
        <p style="margin-top:8px; font-size:13.5px; color:var(--muted);">Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="card" style="border-radius:16px; overflow:hidden; box-shadow:0 4px 40px rgba(0,0,0,.10);">
        <form method="post" style="padding:32px; display:flex; flex-direction:column; gap:20px;">
            {% csrf_token %}

            {% if form.errors %}
            <div style="display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--danger-l); color:var(--danger); border-radius:8px; font-size:13px; font-weight:500;">
                <i class="bi bi-exclamation-circle-fill"></i>
                Invalid username or password. Please try again.
            </div>
            {% endif %}

            <!-- Username -->
            <div style="position:relative;">
                <label style="
                    position:absolute; left:14px; top:50%; transform:translateY(-50%);
                    font-size:13px; color:var(--muted); font-weight:400;
                    text-transform:none; letter-spacing:0;
                    pointer-events:none; transition:all .18s ease;
                    z-index:1;
                " id="lbl-username">Username</label>
                <input
                    type="text" name="username" id="id_username"
                    required autofocus autocomplete="username"
                    style="
                        width:100%; padding:22px 14px 8px;
                        background:var(--bg); border:1.5px solid var(--border);
                        border-radius:10px; font-size:14px; color:var(--text);
                        font-family:inherit; transition:border-color .15s;
                        outline:none;
                    "
                    onfocus="floatLabel('lbl-username','id_username')"
                    onblur="sinkLabel('lbl-username','id_username')"
                    oninput="floatLabel('lbl-username','id_username')"
                >
            </div>

            <!-- Password -->
            <div style="position:relative;">
                <label style="
                    position:absolute; left:14px; top:50%; transform:translateY(-50%);
                    font-size:13px; color:var(--muted); font-weight:400;
                    text-transform:none; letter-spacing:0;
                    pointer-events:none; transition:all .18s ease;
                    z-index:1;
                " id="lbl-password">Password</label>
                <input
                    type="password" name="password" id="id_password"
                    required autocomplete="current-password"
                    style="
                        width:100%; padding:22px 44px 8px 14px;
                        background:var(--bg); border:1.5px solid var(--border);
                        border-radius:10px; font-size:14px; color:var(--text);
                        font-family:inherit; transition:border-color .15s;
                        outline:none;
                    "
                    onfocus="floatLabel('lbl-password','id_password')"
                    onblur="sinkLabel('lbl-password','id_password')"
                    oninput="floatLabel('lbl-password','id_password')"
                >
                <!-- Show/hide toggle -->
                <button type="button" onclick="togglePwd()" style="
                    position:absolute; right:12px; top:50%; transform:translateY(-50%);
                    background:none; border:none; cursor:pointer;
                    color:var(--muted); font-size:16px; padding:4px;
                " title="Show/hide password">
                    <i class="bi bi-eye" id="pwd-eye"></i>
                </button>
            </div>

            <!-- Submit -->
            <button type="submit" style="
                width:100%; padding:13px;
                background:var(--text); color:var(--bg);
                border:none; border-radius:10px;
                font-family:inherit; font-size:14px; font-weight:600;
                cursor:pointer; transition:opacity .15s;
                letter-spacing:.2px;
            " onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                Log in
            </button>

            <p style="text-align:center; font-size:13px; color:var(--muted); margin:0;">
                No account? <a href="/signup/" style="color:var(--text); font-weight:500; text-decoration:none; border-bottom:1px solid var(--border);">Create one</a>
            </p>

            <a href="/" style="
                display:flex; align-items:center; justify-content:center; gap:6px;
                font-size:12.5px; color:var(--muted); text-decoration:none;
                padding:6px; border-radius:8px; transition:color .15s;
            " onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
        </form>
    </div>
</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function floatLabel(lblId, inputId) {
    const lbl = document.getElementById(lblId);
    lbl.style.top = '10px';
    lbl.style.transform = 'translateY(0)';
    lbl.style.fontSize = '10.5px';
    lbl.style.fontWeight = '500';
    lbl.style.letterSpacing = '.3px';
    lbl.style.textTransform = 'uppercase';
    document.getElementById(inputId).style.borderColor = 'var(--accent)';
}
function sinkLabel(lblId, inputId) {
    const input = document.getElementById(inputId);
    if (!input.value) {
        const lbl = document.getElementById(lblId);
        lbl.style.top = '50%';
        lbl.style.transform = 'translateY(-50%)';
        lbl.style.fontSize = '13px';
        lbl.style.fontWeight = '400';
        lbl.style.letterSpacing = '0';
        lbl.style.textTransform = 'none';
    }
    document.getElementById(inputId).style.borderColor = 'var(--border)';
}
function togglePwd() {
    const input = document.getElementById('id_password');
    const eye = document.getElementById('pwd-eye');
    if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        eye.className = 'bi bi-eye';
    }
}
// Float labels on page load if autofilled
window.addEventListener('load', () => {
    ['username','password'].forEach(name => {
        const input = document.getElementById('id_' + name);
        if (input && input.value) floatLabel('lbl-' + name, 'id_' + name);
    });
});
</script>
{% endblock %}
