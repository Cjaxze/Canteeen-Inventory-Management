{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login — Canteen IMS</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#f7f6f3;--surface:#fff;--border:#e8e6e0;--text:#1a1916;--muted:#8c8a84;--accent:#2a7a4b;--accent-l:#d0ead9;--danger:#b52a2a;--danger-l:#fad5d5;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 40px rgba(0,0,0,.08);width:100%;max-width:400px;overflow:hidden;}
        .card-header{background:var(--accent);padding:28px 32px;text-align:center;}
        .card-header .icon{font-size:32px;color:#fff;margin-bottom:8px;}
        .card-header h1{font-size:20px;font-weight:500;color:#fff;letter-spacing:-.3px;}
        .card-header p{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:4px;}
        .card-body{padding:32px;display:flex;flex-direction:column;gap:20px;}
        .field{position:relative;}
        .field label{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;transition:all .18s ease;z-index:1;font-weight:400;text-transform:none;letter-spacing:0;}
        .field input{width:100%;padding:22px 14px 8px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color .15s;}
        .field input:focus{border-color:var(--accent);}
        .field .toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;}
        .error{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--danger-l);color:var(--danger);border-radius:8px;font-size:13px;font-weight:500;}
        .btn-submit{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.2px;transition:opacity .15s;}
        .btn-submit:hover{opacity:.88;}
        .footer-link{text-align:center;font-size:13px;color:var(--muted);}
        .footer-link a{color:var(--text);font-weight:500;text-decoration:none;border-bottom:1px solid var(--border);}
        .admin-link{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:var(--bg);border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-decoration:none;transition:background .15s;}
        .admin-link:hover{background:var(--border);}
        .admin-link i{font-size:13px;}
    </style>
</head>
<body>
<div style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:24px;">
        <a href="/" style="font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);text-decoration:none;">
            Canteen<span style="color:var(--accent);">IMS</span>
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="icon"><i class="bi bi-person-badge"></i></div>
            <h1>Staff Portal</h1>
            <p>Sign in with your employee account</p>
        </div>
        <div class="card-body">
            {% if error %}
            <div class="error"><i class="bi bi-exclamation-circle-fill"></i>{{ error }}</div>
            {% endif %}

            <form method="post" style="display:contents;">
                {% csrf_token %}
                <div class="field">
                    <label id="lbl-u">Username</label>
                    <input type="text" name="username" id="f-u" required autofocus autocomplete="username"
                        onfocus="fl('lbl-u','f-u')" onblur="sl('lbl-u','f-u')" oninput="fl('lbl-u','f-u')">
                </div>
                <div class="field">
                    <label id="lbl-p">Password</label>
                    <input type="password" name="password" id="f-p" required autocomplete="current-password"
                        onfocus="fl('lbl-p','f-p')" onblur="sl('lbl-p','f-p')" oninput="fl('lbl-p','f-p')">
                    <button type="button" class="toggle" onclick="tp('f-p','eye-p')"><i class="bi bi-eye" id="eye-p"></i></button>
                </div>
                <button type="submit" class="btn-submit"><i class="bi bi-box-arrow-in-right"></i> Log In</button>
            </form>
            <p class="footer-link">No account? <a href="/staff/signup/">Sign up</a></p>
        </div>
        <a href="/owner/login/" class="admin-link">
            <i class="bi bi-shield-lock"></i> Owner Portal
        </a>
        <a href="/" class="admin-link" style="border-top:1px solid var(--border);">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>
</div>
<script>
function fl(l,i){const lb=document.getElementById(l);lb.style.top='10px';lb.style.transform='translateY(0)';lb.style.fontSize='10.5px';lb.style.fontWeight='500';lb.style.letterSpacing='.3px';lb.style.textTransform='uppercase';}
function sl(l,i){const input=document.getElementById(i);if(!input.value){const lb=document.getElementById(l);lb.style.top='50%';lb.style.transform='translateY(-50%)';lb.style.fontSize='13px';lb.style.fontWeight='400';lb.style.letterSpacing='0';lb.style.textTransform='none';}}
function tp(id,eid){const i=document.getElementById(id),e=document.getElementById(eid);i.type=i.type==='password'?'text':'password';e.className=i.type==='password'?'bi bi-eye':'bi bi-eye-slash';}
</script>
</body>
</html>
