{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen IMS</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

<nav>
    <a class="nav-brand" href="/">Canteen<span>IMS</span></a>
    <div class="nav-links">
        <a class="nav-link" href="/about/">About</a>
        <a class="nav-link" href="/contact/">Contact</a>
        <div class="nav-divider"></div>
        <a class="nav-link accent-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
</nav>

{% if messages %}
<div class="alert-wrap">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
        <i class="bi bi-{% if 'error' in message.tags %}exclamation-circle{% else %}check-circle{% endif %}"></i>
        {{ message }}
        <button class="alert-close" onclick="this.parentElement.remove()">✕</button>
    </div>
    {% endfor %}
</div>
{% endif %}

<main>
    {% block content %}{% endblock %}
</main>

<script>
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const saved = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', saved);
    btn.textContent = saved === 'dark' ? '☀️' : '🌙';
    btn.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        btn.textContent = next === 'dark' ? '☀️' : '🌙';
    });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
