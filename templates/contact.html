{% extends 'base.html' %}
{% block content %}
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; padding:40px 0;">
<div style="width:100%; max-width:580px;">
<div class="page-header" style="justify-content:center;"><div style="text-align:center;"><p class="page-title">Contact</p></div></div>
<div class="card form-card" style="max-width:100%;">
    <div class="form-body">
        <form method="post" style="display:contents;">
            {% csrf_token %}
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="name" required placeholder="e.g. Juan dela Cruz">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea name="message" required placeholder="Write your message..."></textarea>
            </div>
            <div class="form-actions">
                <a href="/" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
